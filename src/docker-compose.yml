version: '3.8'

services:
  # Servicio de la Base de Datos
  db:
    image: mysql:8.0
    container_name: mi_base_datos
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ngfana
      MYSQL_DATABASE: mi_proyecto_db
      MYSQL_USER: usuario
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - red-proyecto

  # Servicio de tu Aplicación
  app:
    build: .
    container_name: mi_app
    restart: always
    ports:
      - "3000:3000" # Cambia el puerto según tu tecnología (ej. 8000 para Python, 5000, etc.)
    environment:
      - DB_HOST=db  # ¡El nombre del servicio de arriba se usa como host!
      - DB_USER=usuario
      - DB_PASSWORD=password
      - DB_NAME: mi_proyecto_db
      - DB_PORT=3306
    depends_on:
      - db
    networks:
      - red-proyecto

volumes:
  db_data:

networks:
  red-proyecto:
    driver: bridge